# Lancer Jenkins en local :  cp .env.example .env  puis  docker compose up -d --build   →  http://localhost:8080
services:
  jenkins:
    build: .
    container_name: jenkins-afro-food
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - JENKINS_URL=${JENKINS_URL:-http://localhost:8080/}
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # accès Docker de l'hôte : réservé à une machine de confiance
volumes:
  jenkins_home:
