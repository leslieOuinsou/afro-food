# App Fly.io — Jenkins Afro-food
# Docs : docs/FLY-JENKINS.md

app = 'afro-food-jenkins'
primary_region = 'cdg'

[build]
  dockerfile = 'Dockerfile.fly'

[env]
  JENKINS_ADMIN_ID = 'admin'
  JENKINS_LECTURE = 'anonymous'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']
  # Pas de healthcheck HTTP : Jenkins met >1 min à démarrer (Fly limite grace à 1 min)

[[vm]]
  size = 'shared-cpu-2x'
  memory = '4096mb'

[mounts]
  source = 'jenkins_home'
  destination = '/var/jenkins_home'
  initial_size = '10gb'
