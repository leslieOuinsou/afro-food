name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · tests et schéma
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      # URL factice : prisma validate / generate n'ouvrent aucune connexion
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: secret-de-test-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Schéma Prisma valide
        run: npx prisma validate
      - name: Tests unitaires
        run: npm test
      - name: Audit des dépendances (production, niveau high)
        run: npm audit --omit=dev --audit-level=high

  frontend:
    name: Frontend · lint, types et build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: https://api.example.test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint (les erreurs font échouer, les avertissements non)
        run: npx eslint src
      - name: Types TypeScript
        run: npx tsc --noEmit
      - name: Build Next.js
        run: npx next build
      - name: Audit des dépendances (production, niveau high)
        run: npm audit --omit=dev --audit-level=high

  migrations:
    name: Migrations · aucune opération destructrice
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Contrôle des fichiers de migration
        run: bash scripts/verifier-migrations.sh

  secrets:
    name: Sécurité · détection de secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
